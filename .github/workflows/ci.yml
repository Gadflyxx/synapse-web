# CI for the single `build` job below runs four gates -- lint, typecheck, unit
# tests, and a production build -- as one job. The job `name:` is the required
# status check for branch protection, so it must not change casually.
#
# ---------------------------------------------------------------------------
# CACHING
#
# Three caches, restored immediately before the step that consumes them. Each is
# `actions/cache/restore` + `actions/cache/save` rather than a single `actions/cache`
# step, because a save is only worth its upload on a miss, and `restore-keys` need
# to be explicit. `setup-node`'s built-in `cache: npm` is removed in favour of the
# explicit npm step below, so all three caches have the same shape.
#
# Rules that shaped the keys:
#
#   * Content, not commit, is what invalidates. A cache built from a different
#     package-lock.json is never reused for a build, so the lockfile is hashed
#     into the `.next/cache` and Vitest keys.
#   * A trailing `-${{ github.sha }}` is on the two *derived* caches. A build cache
#     is only correct for the tree that produced it, so the exact key stays
#     per-commit, and `restore-keys` supplies the nearest safe ancestor. That
#     gives an exact hit on a re-run of the same commit and a prefix hit on the
#     next commit, but a miss after any lockfile or `next.config.ts` change.
#   * The npm *download* cache deliberately uses a coarse `Linux-npm-` fallback. npm
#     verifies every tarball against the integrity hash in the lockfile, so a
#     tarball downloaded under a previous lockfile is still correct, and that is
#     the entire point of the npm cache.
#
# Two things this workflow deliberately does not do:
#
#   * It does not widen `GITHUB_TOKEN` permissions. `actions/cache/save` needs no
#     extra scope, and a fork PR's cache is scoped to that PR's merge ref by
#     GitHub, so an outside contributor cannot seed the base branch cache. The
#     code being cached here is not the concern; poisoning is, and keeping the
#     default token read-only is the mitigation.
#   * It does not cache `.next` itself, only `.next/cache`. `.next` is the
#     deployable output; `.next/cache` is the compiler's private memo of how it
#     got there. The build always regenerates `.next` from the checked-out source
#     on the runner, and this workflow has no upload-artifact step, so no cached
#     bytes are ever published from a PR build.
#
# Next.js asks for exactly this. When `.next/cache` is absent, `next build` on CI
# prints: "No build cache found. Please configure build caching for faster
# rebuilds." (nextjs.org/docs/messages/no-cache)
#
# No attempt is made to quantify how much time any of this saves; run-to-run
# variance on shared runners is larger than the effect being measured.
# ---------------------------------------------------------------------------

name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Compatibility matrix (#174)
  #
  # Deliberate counterpoint to the single pinned Node version used by the
  # build/publish job below. Pinning keeps the artifact reproducible; it also
  # hides breakage on the versions contributors actually run locally. Both are
  # wanted, so the *test* job is matrixed and the *build* job stays pinned.
  #
  # node-version: [20, 22] — 20 is the pinned build target, 22 is the current
  # LTS. Node 24 is intentionally not in the matrix yet: jsdom 25 and the
  # stellar-sdk dependency chain are not verified against it, and adding an
  # unverified major would mean triaging failures nobody can act on. See the
  # "Known limitations" section of the PR body.
  #
  # Cost control:
  #   - fail-fast: false. With fail-fast: true a failure on Node 20 cancels the
  #     Node 22 leg, which is precisely the information the matrix exists to
  #     produce. The three legs are cheap and independent, so let them all run.
  #   - Only `npm run test` is matrixed. Lint, typecheck and build are version
  #     independent for this repo and stay in the single pinned job.
  #   - setup-node's npm cache is keyed per Node version automatically.
  # ---------------------------------------------------------------------------
  test:
    name: Test · Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

  quality:
    name: Quality gates
    uses: ./.github/workflows/quality.yml

  preview-deploy:
    name: Deploy PR preview
    needs: quality
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: preview
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

  # ---------------------------------------------------------------------------
  # Lint / typecheck / production build.
  #
  # Stays on the single pinned Node version (see the version-pinning issue): the
  # build output is what gets published, and a reproducible build is worth more
  # here than a second opinion from another runtime.
  # ---------------------------------------------------------------------------
  lint-typecheck-build:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Node version is read from .nvmrc rather than hardcoded here, so the
      # runner, local `nvm use`, and the Docker dev environment cannot drift apart.
      # .nvmrc is verified against package.json "engines" by the step below.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      # Fail fast, before anything is installed, built, or cached. See #172: the
      # repo history already contains a jsdom/Node incompatibility fix and a
      # lockfile regenerated to match CI's npm, both caused by this drifting.
      - name: Verify pinned Node and npm versions
        run: node scripts/check-toolchain.mjs

      - name: Install dependencies
        run: npm ci

      # `npm ci` is defined never to write the lockfile. If it did — because the
      # lockfile was generated by a different npm, or is internally inconsistent —
      # the install would silently diverge from what is committed, which is the
      # exact failure mode of the "regenerate package-lock.json to match CI" commit
      # in this repo's history.
      - name: Verify npm ci left the lockfile untouched
        run: |
          if ! git diff --exit-code -- package-lock.json; then
            echo "::error::npm ci modified package-lock.json. The committed lockfile is not consistent with the pinned toolchain. Regenerate it locally with the pinned Node/npm and commit the result."
            exit 1
          fi
          echo "package-lock.json unchanged by npm ci"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Dependency supply-chain audit (#178)
  #
  # Hard gate against supply-chain compromise of a dependency: a malicious
  # version published under a trusted package name. Standard CVE scanning is
  # covered by the DevOps-category issue; this job covers what that cannot:
  #
  #   1. Lockfile-exact installs. `npm ci` (never `npm install`) is enforced
  #      here and in every other job in this workflow, so the tree that is
  #      audited is byte-for-byte the tree that is committed. A grep guard
  #      fails the job if any workflow reintroduces `npm install`.
  #   2. Provenance/attestation verification via `npm audit signatures`, which
  #      checks the registry signature on every installed package against the
  #      lockfile integrity hash. This is the check that catches a tarball
  #      swapped under a trusted name.
  #
  # Edge case: packages that do not yet publish provenance attestations are an
  # accepted gap, not a blocking failure. `npm audit signatures` reports them
  # and exits non-zero only for packages that *do* claim a signature and fail
  # verification, so the gate stays hard on real tampering while the coverage
  # percentage is printed as a baseline to improve over time.
  # ---------------------------------------------------------------------------
  supply-chain-audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      # Enforce `npm ci` everywhere. `npm install` can resolve a version that
      # is not in the lockfile, which is exactly how a malicious release gets
      # pulled in without a lockfile diff to review.
      - name: Enforce npm ci (never npm install) across workflows
        run: |
          if grep -rnE 'npm[[:space:]]+install' .github/workflows/; then
            echo "::error::Found 'npm install' in .github/workflows. Use 'npm ci' so installs are lockfile-exact."
            exit 1
          fi
          echo "No 'npm install' usage found in .github/workflows"

      - name: Install dependencies (lockfile-exact)
        run: npm ci

      # Hard gate: fails if any package that claims a registry signature fails
      # verification. Packages without provenance are reported, not fatal.
      - name: Verify package signatures and provenance
        run: npm audit signatures

      # Visibility, not a gate: print how many installed packages carry a
      # provenance attestation so the coverage baseline is recorded in the log
      # and can be tracked as it improves.
      - name: Report provenance coverage baseline
        run: |
          total=$(node -e "const l=require('./package-lock.json');console.log(Object.keys(l.packages||{}).filter(p=>p).length)")
          echo "Installed packages in lockfile: ${total}"
          echo "::notice::Provenance coverage baseline: see 'npm audit signatures' output above. Packages without attestations are an accepted gap (tracked in #178) and do not fail this gate."

  # ------------------------------------------------------------
